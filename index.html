	<style>
		/* colours, fonts and controls follow Bellmaps and Wright Jobs */
		:root {
			--bm-bg: #070705; --bm-surface: #17140f; --bm-border: #6b5c3e; --bm-border-soft: #6b5c3e8c;
			--bm-text: #e8e0cf; --bm-text-dim: #a99a7e; --bm-accent: #fff6e2;
			--bm-gold: #c8a85a; --bm-bronze: #c9924a;
			--bm-font: "Iowan Old Style", Georgia, "Times New Roman", serif;
			--bm-font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
			color-scheme: dark;
		}

		* { box-sizing: border-box; }

		html, body { height: 100%; }

		body {
			margin: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 2.5rem;
			padding: 2rem 1rem;
			background: radial-gradient(ellipse at 50% -20%, var(--bm-surface) 0%, var(--bm-bg) 60%) fixed;
			color: var(--bm-text);
			font: 16px/1.45 var(--bm-font);
			text-align: center;
		}

		::selection { background: var(--bm-border); }

		h1 {
			margin: 0;
			color: var(--bm-text);
			font-size: 1.05rem;
			font-weight: 700;
			letter-spacing: 0.3em;
			text-transform: uppercase;
		}

		section {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.9rem;
			max-width: 40rem;
			padding-top: 2.5rem;
			border-top: 1px solid var(--bm-border-soft);
		}

		h1 + section { border-top: 0; padding-top: 0; }

		h2 {
			margin: 0;
			color: var(--bm-gold);
			font-size: clamp(2rem, 8vw, 3.6rem);
			font-style: italic;
			font-weight: 400;
			line-height: 1.15;
		}

		p {
			margin: 0;
			color: var(--bm-text-dim);
			font-family: var(--bm-font-ui);
			font-size: 0.85rem;
			letter-spacing: 0.04em;
		}

		a.button {
			display: inline-block;
			margin-top: 0.3rem;
			padding: 0.6rem 1.6rem;
			border: 1px solid var(--bm-border);
			border-radius: 2px;
			background: transparent;
			color: var(--bm-text);
			font-size: 0.8rem;
			font-family: var(--bm-font-ui);
			letter-spacing: 0.12em;
			text-transform: uppercase;
			text-decoration: none;
			transition: border-color 0.2s ease, color 0.2s ease;
		}

		a.button:hover,
		a.button:focus-visible {
			border-color: var(--bm-accent);
			color: var(--bm-accent);
		}

		a.button:focus-visible { outline: 1px solid var(--bm-gold); outline-offset: 2px; }
	</style>
</head>

	</section>
	<section>

	</section>
